<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="1000" height="440" fill="#fcfcfb"/>

  <!-- clients -->
  <rect x="15" y="62" width="200" height="104" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="29" y="88" font-size="15" font-weight="bold" fill="#0b0b0b">MCP client</text>
  <text x="29" y="112" font-size="12.5" fill="#52514e">initialize, tools/list,</text>
  <text x="29" y="130" font-size="12.5" fill="#52514e">tools/call × n</text>
  <text x="29" y="152" font-size="11.5" fill="#898781">JSON-RPC, both MCP revisions</text>

  <rect x="15" y="236" width="200" height="84" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="29" y="262" font-size="15" font-weight="bold" fill="#0b0b0b">Plain call</text>
  <text x="29" y="286" font-size="12.5" fill="#52514e">POST benchmark input,</text>
  <text x="29" y="304" font-size="12.5" fill="#52514e">as SeBS always did</text>

  <!-- function -->
  <rect x="250" y="20" width="560" height="360" rx="10" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="266" y="44" font-size="15" font-weight="bold" fill="#0b0b0b">One deployed function, one URL</text>
  <text x="552" y="44" font-size="12.5" fill="#52514e">(deployed by SeBS)</text>

  <rect x="266" y="124" width="150" height="136" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
  <text x="341" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b0b0b">platform handler</text>
  <text x="341" y="172" text-anchor="middle" font-size="12" fill="#52514e">AWS · GCP ·</text>
  <text x="341" y="190" text-anchor="middle" font-size="12" fill="#52514e">Azure · local</text>
  <text x="341" y="222" text-anchor="middle" font-size="12.5" fill="#0b0b0b">JSON-RPC body?</text>
  <text x="341" y="242" text-anchor="middle" font-size="11.5" fill="#898781">yes → MCP · no → plain</text>

  <!-- MCP layer -->
  <rect x="452" y="62" width="168" height="180" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="466" y="84" font-size="13" font-weight="bold" fill="#0b0b0b">MCP layer</text>
  <rect x="464" y="96" width="144" height="58" rx="5" fill="#2a78d6"/>
  <text x="536" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">stdlib shim</text>
  <text x="536" y="140" text-anchor="middle" font-size="11.5" fill="#ffffff">default · 0.03 MB</text>
  <rect x="464" y="166" width="144" height="62" rx="5" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
  <text x="536" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0b0b0b">official MCP SDK</text>
  <text x="536" y="210" text-anchor="middle" font-size="11.5" fill="#52514e">sdk variant · 41 MB</text>

  <!-- benchmark -->
  <rect x="652" y="96" width="144" height="200" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="724" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b0b0b">benchmark</text>
  <text x="724" y="138" text-anchor="middle" font-size="12" fill="#52514e">handler(event)</text>
  <text x="666" y="166" font-size="12" fill="#52514e">010, 110 (SeBS)</text>
  <text x="666" y="188" font-size="12" fill="#0b0b0b">610.api-proxy</text>
  <text x="666" y="208" font-size="12" fill="#0b0b0b">620.fetch-md</text>
  <text x="666" y="228" font-size="12" fill="#0b0b0b">630.data-analysis</text>
  <text x="666" y="256" font-size="11" fill="#898781">same code, same</text>
  <text x="666" y="272" font-size="11" fill="#898781">inputs, validation</text>

  <!-- arrows -->
  <g stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="217" y1="114" x2="262" y2="160"/>
    <line x1="217" y1="278" x2="262" y2="232"/>
    <path d="M 418 160 H 448"/>
    <line x1="610" y1="160" x2="648" y2="160"/>
    <path d="M 418 232 V 230 H 430 V 274 H 648"/>
    <line x1="798" y1="200" x2="836" y2="200"/>
  </g>
  <text x="440" y="292" font-size="12" fill="#52514e">plain: SeBS's existing path</text>

  <text x="266" y="330" font-size="12.5" fill="#0b0b0b">Both paths report: time in the function, CPU time, import time, cold or warm.</text>
  <text x="266" y="350" font-size="12.5" fill="#0b0b0b">MCP results carry them in the tool result's _meta; the client adds round-trip times.</text>

  <!-- upstream -->
  <rect x="840" y="146" width="145" height="108" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="912" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b0b0b">Mock upstream</text>
  <text x="912" y="198" text-anchor="middle" font-size="12" fill="#52514e">API, web page,</text>
  <text x="912" y="216" text-anchor="middle" font-size="12" fill="#52514e">dataset; latency</text>
  <text x="912" y="234" text-anchor="middle" font-size="12" fill="#52514e">and size set</text>

  <text x="15" y="410" font-size="13" fill="#0b0b0b"><tspan font-weight="bold">MCP − plain</tspan> = what MCP costs on the platform.   <tspan font-weight="bold">SDK − shim</tspan> = what a realistic dependency stack costs (cold starts).</text>
</svg>
