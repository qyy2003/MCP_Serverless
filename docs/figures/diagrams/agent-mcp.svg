<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="1000" height="500" fill="#fcfcfb"/>

  <!-- Agent -->
  <rect x="20" y="62" width="190" height="120" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="115" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b0b0b">AI agent</text>
  <text x="115" y="116" text-anchor="middle" font-size="13" fill="#52514e">LLM turn</text>
  <text x="115" y="136" text-anchor="middle" font-size="13" fill="#52514e">→ tool call (MCP)</text>
  <text x="115" y="156" text-anchor="middle" font-size="13" fill="#52514e">→ waits → next turn</text>

  <!-- agent -> platform -->
  <line x1="212" y1="122" x2="296" y2="122" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <text x="254" y="112" text-anchor="middle" font-size="12" fill="#52514e">JSON-RPC</text>
  <text x="254" y="140" text-anchor="middle" font-size="12" fill="#52514e">over HTTPS</text>

  <!-- Platform -->
  <rect x="300" y="30" width="450" height="184" rx="10" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="316" y="54" font-size="15" font-weight="bold" fill="#0b0b0b">Serverless platform</text>
  <text x="496" y="54" font-size="13" fill="#52514e">AWS Lambda · GCP Cloud Run · Azure</text>
  <rect x="316" y="78" width="104" height="116" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
  <text x="368" y="126" text-anchor="middle" font-size="13" fill="#0b0b0b">front end,</text>
  <text x="368" y="146" text-anchor="middle" font-size="13" fill="#0b0b0b">router</text>
  <line x1="422" y1="136" x2="446" y2="136" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="450" y="70" width="286" height="132" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2"/>
  <text x="464" y="90" font-size="12" fill="#898781">function instance (new on a cold start)</text>
  <rect x="464" y="100" width="258" height="40" rx="5" fill="#2a78d6"/>
  <text x="593" y="125" text-anchor="middle" font-size="13" fill="#ffffff">MCP layer (shim or official SDK)</text>
  <rect x="464" y="150" width="258" height="40" rx="5" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="593" y="175" text-anchor="middle" font-size="13" fill="#0b0b0b">tool code = SeBS benchmark</text>

  <!-- platform -> upstream -->
  <line x1="752" y1="122" x2="806" y2="122" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <text x="779" y="112" text-anchor="middle" font-size="12" fill="#52514e">HTTP</text>

  <!-- Upstream -->
  <rect x="810" y="62" width="170" height="120" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="895" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b0b0b">Upstream</text>
  <text x="895" y="116" text-anchor="middle" font-size="13" fill="#52514e">API · web page · data</text>
  <text x="895" y="142" text-anchor="middle" font-size="12" fill="#898781">ours: a mock with</text>
  <text x="895" y="160" text-anchor="middle" font-size="12" fill="#898781">set latency and size</text>

  <!-- result back to the agent -->
  <path d="M 593 216 V 240 H 115 V 188" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <text x="320" y="260" text-anchor="middle" font-size="13" fill="#0b0b0b">result: the agent waits for every tool call (Q2: they don't overlap with LLM time)</text>

  <!-- Timeline -->
  <text x="20" y="312" font-size="15" font-weight="bold" fill="#0b0b0b">Where one session's time goes</text>
  <text x="310" y="312" font-size="12" fill="#898781">(not to scale; our measurements, in-region)</text>

  <rect x="20" y="326" width="250" height="38" rx="4" fill="#eb6834"/>
  <text x="145" y="350" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">cold start: boot + import</text>
  <rect x="272" y="326" width="196" height="38" rx="4" fill="#1baf7a"/>
  <text x="370" y="350" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">handshake</text>
  <rect x="470" y="326" width="56" height="38" rx="4" fill="#898781"/>
  <rect x="528" y="326" width="196" height="38" rx="4" fill="#2a78d6"/>
  <text x="626" y="350" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">upstream wait</text>
  <rect x="726" y="326" width="24" height="38" rx="4" fill="#eda100"/>
  <text x="764" y="350" font-size="13" fill="#52514e">… LLM turn …</text>
  <rect x="868" y="326" width="28" height="38" rx="4" fill="#898781"/>
  <rect x="898" y="326" width="82" height="38" rx="4" fill="#2a78d6"/>

  <!-- brackets -->
  <path d="M 470 372 v 6 h 280 v -6" fill="none" stroke="#52514e" stroke-width="1.2"/>
  <text x="610" y="394" text-anchor="middle" font-size="13" fill="#0b0b0b" font-weight="bold">tools/call</text>

  <text x="20" y="420" font-size="12.5" fill="#0b0b0b" font-weight="bold">Q3 cold start</text>
  <text x="20" y="438" font-size="12" fill="#52514e">Lambda 0.2–1.5 s · GCP ~1–10 s</text>
  <text x="20" y="455" font-size="12" fill="#52514e">official SDK / pandas: 3.5–7 s</text>
  <text x="20" y="472" font-size="12" fill="#52514e">GCP, idle after &gt; 15 min idle: every timegt; 15 min: always cold</text>

  <text x="272" y="420" font-size="12.5" fill="#0b0b0b" font-weight="bold">MCP handshake</text>
  <text x="272" y="438" font-size="12" fill="#52514e">3 round trips per session</text>
  <text x="272" y="455" font-size="12" fill="#52514e">44–52 ms in-region</text>
  <text x="272" y="472" font-size="12" fill="#52514e">180–260 ms over a WAN</text>

  <text x="470" y="420" font-size="12.5" fill="#0b0b0b" font-weight="bold">Q1 per call</text>
  <text x="470" y="438" font-size="12" fill="#52514e"><tspan fill="#898781" font-weight="bold">■</tspan> platform path 10–20 ms</text>
  <text x="470" y="455" font-size="12" fill="#52514e"><tspan fill="#2a78d6" font-weight="bold">■</tspan> upstream latency (set by the mock)</text>
  <text x="470" y="472" font-size="12" fill="#52514e"><tspan fill="#eda100" font-weight="bold">■</tspan> compute &lt; 1 ms · MCP itself ±3 ms</text>

  <text x="764" y="420" font-size="12.5" fill="#0b0b0b" font-weight="bold">Q4 billing</text>
  <text x="764" y="438" font-size="12" fill="#52514e">95–100% of billed time</text>
  <text x="764" y="455" font-size="12" fill="#52514e">is waiting; Cloud Run bills</text>
  <text x="764" y="472" font-size="12" fill="#52514e">each request ≥ 100 ms</text>
</svg>
